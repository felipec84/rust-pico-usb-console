# Configuración de cargo-generate para usar este repo como template.
# Este archivo solo existe en la rama `master` (template) y cargo-generate
# lo elimina del proyecto generado. El nombre del proyecto (project-name /
# crate_name) lo pide cargo-generate siempre; aquí se definen los
# placeholders adicionales.

[template]
cargo_generate_version = ">=0.10.0"
# Archivos de la casa (la máquina de Felipe), no de la plantilla: viven en
# develop y bajan a master con el merge, pero un proyecto generado no los
# hereda — hablan de un mecanismo que en otra máquina no existe.
ignore = ["EN_ESPERA.md", ".buscar.conf"]

[placeholders.product-name]
type = "string"
prompt = "USB product string (aparece en lsusb/picotool y en el banner — máx 40 caracteres)"
# Máx 40: el banner "[<nombre> - escribe 'help']\r\n" debe caber en un
# paquete CDC de 64 bytes. El firmware además lo verifica en compilación
# (const asserts en main.rs), así que un nombre largo no compila en vez
# de romper la enumeración USB.
regex = "^.{1,40}$"
default = "Pico USB Console"

[placeholders.manufacturer]
type = "string"
prompt = "USB manufacturer string"
default = "Raspberry Pi"

# Escribe TEMPLATE_ORIGIN en el proyecto generado: de qué commit de esta
# plantilla nació. cargo-generate no ofrece nada para esto (ninguna variable
# expone el template), y sin el sello el derivado queda sin ningún rastro de
# su origen — ver el comentario largo en stamp.rhai.
#
# El script pide correr `git ls-remote`, así que cargo-generate va a pedir
# confirmación (o exigir --allow-commands en modo silencioso). Se puede negar
# sin romper nada: el sello está envuelto en try/catch y en ese caso el
# proyecto se genera igual, con el hash en "desconocido" y las instrucciones
# para completarlo a mano.
#
# Como todo lo de este archivo, el .rhai no viaja al proyecto generado.
[hooks]
post = ["stamp.rhai"]
