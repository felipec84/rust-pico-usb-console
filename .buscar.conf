# Escrito el 26-sep-2026 (barrido de la casa).
#
# 🟢 HOY NO SE DECLARA NADA, y es una decisión:
#    · los cuatro `.md` versionados (README, CLAUDE, la guía, la investigación de re-enumeración)
#      son documentación VIGENTE de la plantilla; la investigación es la que cierra las hipótesis
#      descartadas, que es justo lo que otro repo RP2040 tiene que poder encontrar;
