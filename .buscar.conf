#    (`apuntes/bin/rs/buscar-punteros/src/casa.rs`, `REMOTOS_DE_LA_CASA`), y el de acá es GitHub.
#    No sale en el censo ni como «fuera por umbral». Re-medir:
#      ~/Desarrollos/apuntes/bin/s/buscar-punteros --censo 2>&1 | grep rust-pico
#    ⚠️ El día que entre, ojo con el piso de volumen (50.000 chars de `.md`): el repo anda justo
#    ahí (50.199 el 26-sep, `git ls-files '*.md' | xargs wc -m`). Excluir algo puede dejarlo fuera.
#
# 🔑 Este archivo y `EN_ESPERA.md` son de la CASA, no de la plantilla: `master` los lista en
